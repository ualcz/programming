<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 009 - API DO POKEMON</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body >
    <main>
        <section class="pokemon-area">
            <h2>Cards Pokemon</h2>

            <div id="cards-container" class="cards-container">
                <div class="pokemon-card">
                    <div class="pokemon-img">
                        <img src="" alt="pokemon img">
                    </div>
                    <div class="pokemon-info">
                        <h3>nome</h3>
                        <p class="pokemon-id">#003</p>
                        <div class="pokemon-tipos">
                            <span class="tipo tipo-grass">Grama</span>
                            <span class="tipo tipo-poison">Veneno</span>
                        </div>
                        <p>altura</p>
                        <p>peso</p>
                        <p>habilidades</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
